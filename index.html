<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="QA Hub — local-first test case management for the team.">
  <title>QA Hub</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script>
    // Apply theme before first paint to avoid a flash.
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('qahub:theme') || '"system"');
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app" class="app">
    <div class="content" style="grid-column: 1 / -1">
      <div class="stack" aria-busy="true" aria-label="Loading QA Hub">
        <div class="skeleton" style="width: 220px; height: 22px"></div>
        <div class="skeleton" style="width: 60%"></div>
        <div class="skeleton" style="width: 80%"></div>
        <div class="skeleton" style="width: 70%"></div>
      </div>
    </div>
  </div>
  <noscript>QA Hub needs JavaScript enabled.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
